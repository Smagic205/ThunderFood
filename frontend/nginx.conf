# Giới hạn tốc độ request theo IP tại tầng Reverse Proxy Nginx
limit_req_zone $binary_remote_addr zone=tf_auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tf_api_limit:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Ẩn phiên bản Nginx & nâng giới hạn upload ảnh (tránh lỗi 413 Request Entity Too Large)
    server_tokens off;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Bật nén Gzip cho văn bản, CSS, JS, JSON, SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers & CSP (giữ same-origin-allow-popups cho Google Sign-In popup)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.onrender.com https://accounts.google.com https://www.googleapis.com http://localhost:* http://127.0.0.1:*; frame-src 'self' https://accounts.google.com; form-action 'self' https://pay-sandbox.sepay.vn https://pay.sepay.vn; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limit chặt hơn cho các endpoint auth trước khi forward tới Backend
    location ^~ /api/v1/auth/ {
        limit_req zone=tf_auth_limit burst=15 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Reverse Proxy nội bộ tới Backend (^~ đảm bảo ưu tiên cao hơn regex file tĩnh)
    location ^~ /api/ {
        limit_req zone=tf_api_limit burst=40 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Cache tài nguyên tĩnh có băm hash (1 năm) cho Cloudflare CDN & Trình duyệt
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # Tắt cache cho file index.html để khách hàng luôn nhận bản build mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.onrender.com https://accounts.google.com https://www.googleapis.com http://localhost:* http://127.0.0.1:*; frame-src 'self' https://accounts.google.com; form-action 'self' https://pay-sandbox.sepay.vn https://pay.sepay.vn; worker-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Định tuyến SPA (Single Page Application) - Tránh lỗi 404 khi F5
    location / {
        try_files $uri $uri/ /index.html;
    }
}
