server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Định tuyến SPA (Single Page Application) - Tránh lỗi 404 khi F5
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh có băm hash (1 năm) cho Cloudflare CDN & Trình duyệt
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Tắt cache cho file index.html để khách hàng luôn nhận bản build mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse Proxy nội bộ tới Backend container khi chạy trong Docker Compose
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
