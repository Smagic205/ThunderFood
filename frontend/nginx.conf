server {
    listen 80;
    server_name localhost;

    # Ẩn phiên bản Nginx & nâng giới hạn upload ảnh (tránh lỗi 413 Request Entity Too Large)
    server_tokens off;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Bật nén Gzip cho văn bản, CSS, JS, JSON, SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers cơ bản (giữ same-origin-allow-popups để Google Sign-In popup hoạt động bình thường)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Reverse Proxy nội bộ tới Backend (^~ đảm bảo ưu tiên cao hơn regex file tĩnh)
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Cache tài nguyên tĩnh có băm hash (1 năm) cho Cloudflare CDN & Trình duyệt
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        access_log off;
    }

    # Tắt cache cho file index.html để khách hàng luôn nhận bản build mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Định tuyến SPA (Single Page Application) - Tránh lỗi 404 khi F5
    location / {
        try_files $uri $uri/ /index.html;
    }
}
