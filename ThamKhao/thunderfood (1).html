  closeDlg();toast('Đã lưu mã giảm giá');refresh();
};
Object.assign(A,{'v-new':()=>vDlg(),'v-edit':t=>vDlg(t.dataset.id),'v-del':t=>{const v=VOUCHERS.find(x=>x.id==t.dataset.id);confirmDlg({title:'Xóa mã giảm giá?',text:`Mã ${esc(v.code)} sẽ bị xóa. Đơn cũ đã dùng mã vẫn giữ nguyên.`,ok:'Xóa mã',danger:true,onOk:()=>{VOUCHERS.splice(VOUCHERS.indexOf(v),1);if(S.voucher&&S.voucher.id===v.id)S.voucher=null;toast('Đã xóa mã');refresh()}})}});
N['v-act']=t=>{VOUCHERS.find(x=>x.id==t.dataset.id).is_active=t.checked;toast(t.checked?'Đã bật mã':'Đã tắt mã')};

/* ---------- REVIEWS ---------- */
on('/admin/reviews','admin',()=>{
  const tab=S.arv||'all';
  const list=REVIEWS.filter(r=>tab==='all'||(tab==='noreply'&&!r.admin_reply&&!r.is_hidden)||(tab==='hidden'&&r.is_hidden));
  const cnt={all:REVIEWS.length,noreply:REVIEWS.filter(r=>!r.admin_reply&&!r.is_hidden).length,hidden:REVIEWS.filter(r=>r.is_hidden).length};
  return {title:'Đánh giá',html:`
  ${ahead('Đánh giá của khách hàng','Ẩn nội dung không phù hợp và phản hồi để khách yên tâm.')}
  <div class="seg" role="tablist">${[['all','Tất cả'],['noreply','Chưa phản hồi'],['hidden','Đã ẩn']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" role="tab" aria-selected="${tab===k}" data-act="arv" data-v="${k}">${l}<span class="n">${cnt[k]}</span></button>`).join('')}</div>
  <div class="stack" style="--gap:14px">${list.map(r=>{const p=getP(r.product_id);return `<article class="card rv-adm ${r.is_hidden?'hidden-rv':''}"><div style="width:64px">${tile(p,'xs').replace('class="tile xs"','class="tile xs" style="border-radius:16px;--tint:'+p.tint+'"')}</div><div><div class="row between wrap" style="gap:8px"><div><b>${esc(r.user)}</b> <span class="faint">đánh giá</span> <a class="tlink" href="#/product/${p.id}">${esc(p.name)}</a></div><div class="row" style="gap:10px">${stars(r.rating,15)}<span class="faint" style="font-size:13px">${fmtD(r.created_at)}</span></div></div>
   <p style="margin:8px 0;color:${r.is_hidden?'var(--ink-3)':'var(--ink)'}">${esc(r.comment)}</p>${r.is_hidden?'<span class="pill s-CANCELLED nodot" style="margin-bottom:8px">Đang ẩn khỏi cửa hàng</span>':''}
   ${r.admin_reply?`<div class="reply"><b>${ic('bolt',15)}Phản hồi của cửa hàng</b>${esc(r.admin_reply)}</div>`:''}
   <div class="row wrap" style="margin-top:12px;gap:8px"><button class="btn btn-soft btn-sm" data-act="rv-reply" data-id="${r.id}">${ic('msg',16)}${r.admin_reply?'Sửa phản hồi':'Phản hồi'}</button><button class="btn ${r.is_hidden?'btn-soft':'btn-danger'} btn-sm" data-act="rv-hide" data-id="${r.id}">${ic(r.is_hidden?'eye':'eye-off',16)}${r.is_hidden?'Hiện lại':'Ẩn đánh giá'}</button></div></div></article>`}).join('')||`<div class="empty card"><h3>Không có đánh giá nào</h3></div>`}</div>`};
});
A.arv=t=>{S.arv=t.dataset.v;refresh()};
A['rv-hide']=t=>{const r=REVIEWS.find(x=>x.id==t.dataset.id);r.is_hidden=!r.is_hidden;toast(r.is_hidden?'Đã ẩn đánh giá':'Đã hiển thị lại đánh giá');refresh()};
A['rv-reply']=t=>{const r=REVIEWS.find(x=>x.id==t.dataset.id);openDlg({title:'Phản hồi đánh giá',body:`<blockquote style="margin:0 0 16px;padding:14px 16px;border-radius:14px;background:var(--surface-2)"><b>${esc(r.user)}</b> ${stars(r.rating,14)}<div class="muted" style="margin-top:4px">${esc(r.comment)}</div></blockquote><form id="rp-f" data-form="reply" data-id="${r.id}"><label class="field"><span>Nội dung phản hồi</span><textarea class="textarea" name="t" placeholder="Cảm ơn bạn đã góp ý…">${esc(r.admin_reply||'')}</textarea></label></form>`,foot:`<button class="btn btn-ghost" data-act="dlg-close">Hủy</button><button class="btn btn-primary" form="rp-f">Gửi phản hồi</button>`})};
F.reply=f=>{const r=REVIEWS.find(x=>x.id==f.dataset.id);const t=f.t.value.trim();if(!t){setErr(f.t,'Nhập nội dung phản hồi');return}r.admin_reply=t;closeDlg();toast('Đã gửi phản hồi');refresh()};

/* ---------- BANNERS ---------- */
/* DB: banners(image_url, link_url, sort_order, is_active) – banner là một tấm ảnh + đường dẫn */
const banPrev=b=>`<div class="bimg"><div class="promo ${b.style||'tint'}" style="border-radius:0;min-height:0;height:100%;padding:18px">${bannerImg(b)}</div></div>`;
on('/admin/banners','admin',()=>{
  const list=[...BANNERS].sort((a,b)=>a.sort_order-b.sort_order);
  return {title:'Banner',html:`
  ${ahead('Banner trang chủ',`${BANNERS.filter(b=>b.is_active).length} banner đang hiển thị. Banner là một tấm ảnh kèm đường dẫn, chữ nằm sẵn trong ảnh.`,`<button class="btn btn-primary" data-act="b-new">${ic('plus',18)}Thêm banner</button>`)}
  <div class="ban-g">${list.map((b,i)=>`<article class="card ban">${banPrev(b)}<div style="padding:16px 18px"><div class="row between"><div style="min-width:0"><b>Banner #${b.id}</b><div class="faint" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Liên kết: ${esc(b.link_url||'Không có')}</div></div><label class="switch"><input type="checkbox" ${b.is_active?'checked':''} data-ch="b-act" data-id="${b.id}" aria-label="Hiển thị banner ${b.id}"><i></i></label></div>
   <div class="row between" style="margin-top:14px"><div class="row" style="gap:4px"><button class="ibtn" data-act="b-move" data-id="${b.id}" data-d="-1" ${i===0?'disabled style="opacity:.35"':''} aria-label="Đưa lên">${ic('chev-u',20)}</button><button class="ibtn" data-act="b-move" data-id="${b.id}" data-d="1" ${i===list.length-1?'disabled style="opacity:.35"':''} aria-label="Đưa xuống">${ic('chev-d',20)}</button><span class="tag">Thứ tự ${i+1}</span></div><div class="row" style="gap:4px"><button class="ibtn" data-act="b-edit" data-id="${b.id}" aria-label="Sửa banner">${ic('edit',19)}</button><button class="ibtn" data-act="b-del" data-id="${b.id}" aria-label="Xóa banner" style="color:var(--c-red)">${ic('trash',19)}</button></div></div></div></article>`).join('')}</div>`};
});
let BIMG=null;
function bDlg(id){
  const b=BANNERS.find(x=>x.id==id)||{link_url:'#/menu',is_active:true,image_url:null};BIMG=b.image_url||null;
  openDlg({title:id?'Sửa banner':'Thêm banner',body:`<form id="b-f" data-form="ban" data-id="${id||''}" class="form-grid" novalidate>
   <div><span class="lbl">Ảnh banner (tỷ lệ 16:8)</span><label class="drop" style="padding:18px">${ic('upload',24)}<b>Bấm để chọn ảnh</b><span class="faint">JPG, PNG hoặc WebP</span><input type="file" accept="image/*" hidden data-ch="bimg"></label><div class="previews" id="b-prev">${BIMG?`<div class="prev" style="width:160px"><img src="${BIMG}" alt=""></div>`:(id?`<div class="prev" style="width:160px;background:var(--volt-soft)"><div class="tile xs">${art(b.art)}</div></div>`:'')}</div><small class="faint" id="b-err" style="color:var(--c-red);display:none;margin-top:6px">Vui lòng chọn ảnh banner</small></div>
   <label class="field"><span>Liên kết khi bấm (không bắt buộc)</span><input class="input" name="link" value="${esc(b.link_url||'')}" placeholder="#/menu?cat=1"></label>
   <label class="row" style="justify-content:space-between"><b>Hiển thị trên trang chủ</b><span class="switch"><input type="checkbox" name="act" ${b.is_active?'checked':''}><i></i></span></label></form>`,foot:`<button class="btn btn-ghost" data-act="dlg-close">Hủy</button><button class="btn btn-primary" form="b-f">Lưu banner</button>`});
}
N.bimg=t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{BIMG=r.result;$('#b-err').style.display='none';$('#b-prev').innerHTML=`<div class="prev" style="width:160px"><img src="${BIMG}" alt=""></div>`};r.readAsDataURL(f)};
F.ban=f=>{
  const ex=f.dataset.id?BANNERS.find(x=>x.id==f.dataset.id):null;
  if(!BIMG&&!(ex&&ex.art)){$('#b-err').style.display='block';return}
  const d={link_url:f.link.value.trim()||null,is_active:f.act.checked,image_url:BIMG};
  if(ex)Object.assign(ex,d);else BANNERS.push({id:Date.now(),sort_order:BANNERS.length+1,...d});
  closeDlg();toast('Đã lưu banner');refresh();
};
Object.assign(A,{'b-new':()=>bDlg(),'b-edit':t=>bDlg(t.dataset.id),
 'b-move':t=>{const l=[...BANNERS].sort((a,b)=>a.sort_order-b.sort_order),i=l.findIndex(x=>x.id==t.dataset.id),j=i+ +t.dataset.d;if(j<0||j>=l.length)return;[l[i].sort_order,l[j].sort_order]=[l[j].sort_order,l[i].sort_order];refresh()},
 'b-del':t=>confirmDlg({title:'Xóa banner?',text:'Banner sẽ bị gỡ khỏi trang chủ.',ok:'Xóa banner',danger:true,onOk:()=>{BANNERS.splice(BANNERS.findIndex(x=>x.id==t.dataset.id),1);toast('Đã xóa banner');refresh()}})});
N['b-act']=t=>{BANNERS.find(x=>x.id==t.dataset.id).is_active=t.checked;toast(t.checked?'Đã hiển thị banner':'Đã ẩn banner')};

/* ---------- SETTINGS ---------- */
on('/admin/settings','admin',()=>({title:'Cấu hình',html:`
  ${ahead('Cấu hình hệ thống','Mỗi mục lưu thành một dòng trong bảng system_settings (khóa và giá trị).',`<button class="btn btn-primary" data-act="save-set">${ic('check',18)}Lưu cấu hình</button>`)}
  <div class="set-grid">
   <section class="card card-p"><div class="card-h"><h3>Phí giao hàng</h3></div><div class="form-grid">
    <label class="field"><span>Phí giao hàng mặc định (₫)</span><input class="input" type="number" min="0" step="1000" id="s-ship" value="${SETTINGS.ship}" inputmode="numeric"><small>Khóa: DEFAULT_SHIPPING_FEE. Áp dụng cho mọi đơn chưa đạt mức miễn phí.</small></label>
    <label class="field"><span>Miễn phí giao hàng từ (₫)</span><input class="input" type="number" min="0" step="10000" id="s-free" value="${SETTINGS.free}" inputmode="numeric"><small>Khóa: FREE_SHIPPING_THRESHOLD. Đặt 0 để tắt miễn phí giao hàng.</small></label></div></section>
   <section class="card card-p"><div class="card-h"><h3>Cửa hàng</h3></div><div class="form-grid"><div class="grid2 keep"><label class="field"><span>Mở cửa</span><input class="input" type="time" id="s-open" value="${SETTINGS.open}"></label><label class="field"><span>Đóng cửa</span><input class="input" type="time" id="s-close" value="${SETTINGS.close}"></label></div><label class="field"><span>Hotline</span><input class="input" id="s-hot" value="${SETTINGS.hotline}"></label></div></section>
   <section class="card card-p"><div class="card-h"><h3>Phương thức thanh toán</h3></div>${Object.keys(PAYM).map(k=>`<div class="set-row"><div class="row" style="gap:12px"><span class="pay-logo" style="background:${PAYM[k].bg}">${PAYM[k].t}</span><div><b>${PAYM[k].n}</b><div class="faint" style="font-size:13px">${PAYM[k].s}</div></div></div><label class="switch"><input type="checkbox" ${SETTINGS.pay[k]?'checked':''} data-ch="s-pay" data-k="${k}" aria-label="Bật ${PAYM[k].n}"><i></i></label></div>`).join('')}</section>

  </div>`}));
Object.assign(N,{'s-pay':t=>SETTINGS.pay[t.dataset.k]=t.checked});
A['save-set']=()=>{SETTINGS.ship=+$('#s-ship').value||0;SETTINGS.free=+$('#s-free').value||0;SETTINGS.open=$('#s-open').value;SETTINGS.close=$('#s-close').value;SETTINGS.hotline=$('#s-hot').value;toast('Đã lưu cấu hình hệ thống')};

/* =========================================================
   Boot
   ========================================================= */
$('.sm-fab').innerHTML=ic('grid',18)+'<span>Sơ đồ trang</span>';
window.addEventListener('hashchange',()=>render());
render();

</script>
</body>
</html>
