spring:
  datasource:
    url: jdbc:h2:mem:thunderfood_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: ThunderFoodTestHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000
  refresh-token:
    expiration: 604800000

app:
  frontend-url: "http://localhost:5173"
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:5175,https://thunderfoods.vercel.app"
  rate-limit:
    enabled: false
  auth:
    cookie-name: "tf_refresh_token"
    cookie-secure: "auto"
    cookie-same-site: "auto"
    cookie-domain: ""
    expose-refresh-token-in-body: false
  google:
    client-id: "test-google-client-id"

sepay:
  enabled: true
  sandbox: true
  merchant-id: "SP-TEST-UNIT0001"
  secret-key: "spsk_test_unit_dummy_secret_key_0001"
  checkout-url: "https://pay-sandbox.sepay.vn/v1/checkout/init"
  pg-api-url: "https://pgapi-sandbox.sepay.vn"
  pg-payment-method: "BANK_TRANSFER"
  bank-code: "MBBank"
  account-number: "0123456789"
  account-name: "THUNDERFOOD SANDBOX"
  webhook-api-key: "test-sepay-webhook-key"
  qr-base-url: "https://qr.sepay.vn/img"
