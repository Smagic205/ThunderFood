server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: backend_thunderfood
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_thunderfood?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: ThunderFoodHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:120000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:10000}

  jpa:
    hibernate:
      ddl-auto: update   # Tự tạo bảng nếu chưa có, cập nhật nếu đã có
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: false   # Tắt Flyway, dùng Hibernate quản lý schema

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:900000}       # 15 phút (ms) cho Access Token trong RAM
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}    # 7 ngày (ms) trong HttpOnly Cookie

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloudinary_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_cloudinary_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_cloudinary_api_secret}

app:
  frontend-url: "${APP_FRONTEND_URL:http://localhost:5173}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3008,http://localhost:3009,http://localhost:3010,https://thunderfoods.vercel.app,https://thunderfoods-admin.vercel.app,https://thunderfoods-staff.vercel.app}"
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    cookie-name: "${AUTH_REFRESH_COOKIE_NAME:tf_refresh_token}"
    cookie-secure: "${AUTH_COOKIE_SECURE:auto}"
    cookie-same-site: "${AUTH_COOKIE_SAME_SITE:auto}"
    cookie-domain: "${AUTH_COOKIE_DOMAIN:}"
    expose-refresh-token-in-body: ${AUTH_EXPOSE_REFRESH_TOKEN_IN_BODY:false}
  google:
    client-id: "${GOOGLE_CLIENT_ID:}"

sepay:
  enabled: ${SEPAY_ENABLED:true}
  sandbox: ${SEPAY_SANDBOX:false}
  merchant-id: ${SEPAY_MERCHANT_ID:}
  secret-key: ${SEPAY_SECRET_KEY:}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
  pg-api-url: ${SEPAY_PG_API_URL:https://pgapi-sandbox.sepay.vn}
  pg-payment-method: ${SEPAY_PG_PAYMENT_METHOD:BANK_TRANSFER}
  bank-code: ${SEPAY_BANK_CODE:MBBank}
  account-number: ${SEPAY_ACCOUNT_NUMBER:}
  account-name: ${SEPAY_ACCOUNT_NAME:}
  webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
  unpaid-expiration-minutes: ${SEPAY_UNPAID_EXPIRATION_MINUTES:15}
