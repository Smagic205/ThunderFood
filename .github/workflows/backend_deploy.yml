name: Backend Deploy (GHCR & Render)

on:
  push:
    branches:
      - main
    paths:
      - 'backend_thunderfood/**'
      - '.github/workflows/backend_deploy.yml'

jobs:
  build-and-push:
    name: Build & Push Image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_thunderfood
          file: ./backend_thunderfood/Dockerfile
          push: true
          tags: |
            ghcr.io/smagic205/thunderfood-backend:latest
            ghcr.io/smagic205/thunderfood-backend:${{ github.sha }}

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK is not set yet, skipping Render deployment."
          fi
