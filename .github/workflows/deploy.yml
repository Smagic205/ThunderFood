name: Build and Push Backend to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'backend_thunderfood/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    name: Build & Push Image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_thunderfood
          file: ./backend_thunderfood/Dockerfile
          push: true
          tags: |
            ghcr.io/smagic205/thunderfood-backend:latest
            ghcr.io/smagic205/thunderfood-backend:${{ github.sha }}

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
