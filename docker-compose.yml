services:
  # Dịch vụ Backend Spring Boot (Kết nối trực tiếp TiDB Cloud)
  backend:
    build:
      context: ./backend_thunderfood
      dockerfile: Dockerfile
    image: ghcr.io/${DOCKER_OWNER:-smagic205}/thunderfood-backend:latest
    container_name: thunderfood_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your_cloudinary_cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your_cloudinary_api_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your_cloudinary_api_secret}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SEPAY_ENABLED: ${SEPAY_ENABLED:-true}
      SEPAY_SANDBOX: ${SEPAY_SANDBOX:-true}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay-sandbox.sepay.vn/v1/checkout/init}
      SEPAY_PG_API_URL: ${SEPAY_PG_API_URL:-https://pgapi-sandbox.sepay.vn}
      SEPAY_PG_PAYMENT_METHOD: ${SEPAY_PG_PAYMENT_METHOD:-BANK_TRANSFER}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-MBBank}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      SEPAY_QR_BASE_URL: ${SEPAY_QR_BASE_URL:-https://qr.sepay.vn/img}

  # Ứng dụng Web Khách hàng (React / Vite)
  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: web
    image: ghcr.io/${DOCKER_OWNER:-smagic205}/thunderfood-web:latest
    container_name: thunderfood_web
    restart: always
    ports:
      - "${FRONTEND_PORT:-3008}:80"
    depends_on:
      - backend

  # Ứng dụng Web Quản trị viên (Admin Portal)
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: admin
    image: ghcr.io/${DOCKER_OWNER:-smagic205}/thunderfood-admin:latest
    container_name: thunderfood_admin
    restart: always
    ports:
      - "${ADMIN_PORT:-3009}:80"
    depends_on:
      - backend

  # Ứng dụng Web Nhân viên & Shipper (Staff Portal)
  frontend-staff:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_NAME: staff
    image: ghcr.io/${DOCKER_OWNER:-smagic205}/thunderfood-staff:latest
    container_name: thunderfood_staff
    restart: always
    ports:
      - "${STAFF_PORT:-3010}:80"
    depends_on:
      - backend
